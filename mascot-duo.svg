<style>@keyframes bounce{0%,100%{transform:translateY(0) rotate(0)}45%{transform:translateY(-8px) rotate(-2deg)}70%{transform:translateY(1px) rotate(2deg)}}@keyframes lean{0%,100%{transform:translate(0,0) rotate(0)}45%{transform:translate(-8px,-4px) rotate(-4deg)}70%{transform:translate(-4px,0) rotate(1deg)}}@keyframes pop{0%,100%{transform:scale(.82) translateY(3px);opacity:.7}50%{transform:scale(1.14) translateY(-8px);opacity:1}}@keyframes twinkle{0%,100%{opacity:.6}50%{opacity:1}}.bear-left{transform-origin:280px 330px;animation:bounce 2.1s ease-in-out infinite}.bear-right{transform-origin:443px 330px;animation:lean 2.6s ease-in-out infinite}.floating-heart{transform-origin:321px 365px;animation:pop 1.9s ease-in-out infinite}.sparkles{animation:twinkle 2.2s ease-in-out infinite}</style><ellipse cx="323" cy="525" rx="206" ry="30" fill="#D8A77F" opacity=".28"/>
